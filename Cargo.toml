[package]
name = "mem-in-black"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "We remember so your agents don't have to. Local memory for coding agents."
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/mem-in-black"
# Keep the published crate small: the README screenshot, the benchmark suite and
# the planning docs are not needed to build or run mib.
exclude = [
    "assets/",
    "bench/",
    "docs/",
]

[[bin]]
name = "mib"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
libc = "0.2"
jsonc-parser = { version = "0.34", features = ["cst"] }
form_urlencoded = "1"
rmcp = { version = "3.4", features = ["transport-io"] }
rusqlite = { version = "0.43", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml_edit = "0.25"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
sha2 = "0.11"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

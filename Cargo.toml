[package]
name = "quietmem"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Local Rust memory service for coding agents"
license = "MIT"
publish = false
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/quietmem"

[[bin]]
name = "quietmem"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
libc = "0.2"
form_urlencoded = "1"
rmcp = { version = "3.4", features = ["transport-io"] }
rusqlite = { version = "0.43", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml_edit = "0.25"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
